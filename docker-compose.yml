services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # SECURITY: NODE_ENV must be set explicitly. Default is 'production'.
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      # SECURITY: DATABASE_URL required - no hardcoded credentials in production
      - DATABASE_URL=${DATABASE_URL:?ERROR: DATABASE_URL environment variable is required for production}
      # SECURITY: JWT_SECRET required - must be strong random value, no fallback allowed
      - JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET environment variable is required. Generate with: openssl rand -hex 64}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=koperasi
      - POSTGRES_PASSWORD=koperasi_pass
      - POSTGRES_DB=koperasi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koperasi -d koperasi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
