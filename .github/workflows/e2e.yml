name: E2E Tests
# Manual only — run from Actions → E2E Tests → Run workflow
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koperasi
          POSTGRES_PASSWORD: koperasi_pass
          POSTGRES_DB: koperasi_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bun run test:e2e
        env:
          DATABASE_URL: postgres://koperasi:koperasi_pass@localhost:5432/koperasi_e2e_test
          JWT_SECRET: ci-test-secret
          BYPASS_RATE_LIMIT: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
