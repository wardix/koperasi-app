name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koperasi
          POSTGRES_PASSWORD: koperasi_pass
          POSTGRES_DB: koperasi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: test-secret-key-123
      DATABASE_URL: postgres://koperasi:koperasi_pass@localhost:5432/koperasi_test
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Typecheck
      run: bun run typecheck

    - name: Test
      # Use package script so only server/src unit tests run (excludes Playwright e2e/)
      run: bun run test

    - name: Build
      run: bun run build
